<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Made By Shaswat — Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="nav">
  <a class="brand" href="/">MADE BY SHASWAT</a>
  <div id="navLinks"></div>
</div>

<div class="wrap">
  <h1>Shop</h1>
  <p class="muted">Templates, presets &amp; asset packs. Log in or sign up to buy.</p>
  <div id="products"></div>
</div>

<script src="auth.js"></script>
<script>
  renderNav('navLinks');

  async function loadProducts() {
    const res = await fetch('/api/products');
    const products = await res.json();
    const el = document.getElementById('products');
    el.innerHTML = products.map(p => `
      <div class="card">
        <div class="muted">${p.tag}</div>
        <h3>${p.title}</h3>
        <p class="muted">${p.description}</p>
        <div class="row">
          <strong>$${p.price_usd}</strong>
          <button class="btn btn-primary" onclick="buy(${p.id})">Buy now</button>
        </div>
      </div>
    `).join('');
  }

  async function buy(productId) {
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = '/login.html?next=/'; return; }
    const res = await fetch('/api/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ productId }),
    });
    if (res.ok) {
      alert('Order placed! Go to "My Orders" to track it — pay the QR code sent to you on WhatsApp.');
      window.location.href = '/account.html';
    } else {
      const data = await res.json();
      alert(data.error || 'Could not place order.');
    }
  }

  loadProducts();
</script>
</body>
</html>
