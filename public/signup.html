<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up — Made By Shaswat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="nav"><a class="brand" href="/">MADE BY SHASWAT</a></div>
<div class="wrap" style="max-width:420px;">
  <h1>Sign up</h1>
  <div class="card">
    <label>Name</label>
    <input id="name" placeholder="Your name">
    <label>Email</label>
    <input id="email" type="email" placeholder="you@email.com">
    <label>Password</label>
    <input id="password" type="password" placeholder="At least 6 characters">
    <label>Country</label>
    <select id="country">
      <option>India</option><option>United States</option><option>United Kingdom</option>
      <option>United Arab Emirates</option><option>Australia</option><option>Canada</option>
      <option>Singapore</option><option>Germany</option><option>France</option>
      <option>Spain</option><option>Italy</option><option>Netherlands</option>
    </select>
    <div class="error" id="err"></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="signup()">Create account</button>
  </div>
  <p class="muted">Already have an account? <a href="/login.html">Log in</a></p>
</div>
<script>
  async function signup() {
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const country = document.getElementById('country').value;
    const res = await fetch('/api/signup', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, email, password, country }),
    });
    const data = await res.json();
    if (!res.ok) { document.getElementById('err').textContent = data.error; return; }
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location.href = '/account.html';
  }
</script>
</body>
</html>
